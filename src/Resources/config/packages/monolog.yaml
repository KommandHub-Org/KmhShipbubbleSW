# Dedicated log channel so this plugin's output is separable from Shopware's.
# ConfigurableLogger decorates monolog.logger.kmh_shipbubble_channel (see services.yml)
# and gates what actually reaches this handler on the plugin's debug settings.
monolog:
  channels: ['kmh_shipbubble_channel']

  handlers:
    shipbubbleLogHandler:
      max_files: 7
      type: rotating_file
      path: "%kernel.logs_dir%/kmh_shipbubble_%kernel.environment%.log"
      channels: ["kmh_shipbubble_channel"]
